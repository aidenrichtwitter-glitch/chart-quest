/** Classic GB double-bordered window. */
function drawBox(g, x, y, w, h) {
  g.fillStyle(C.lightest); g.fillRect(x, y, w, h);
  g.fillStyle(C.darkest);  g.fillRect(x + 3, y + 3, w - 6, h - 6);
  g.fillStyle(C.light);    g.fillRect(x + 5, y + 5, w - 10, h - 10);
  g.fillStyle(C.darkest);  g.fillRect(x + 6, y + 6, w - 12, h - 12);
}

/** Chunky HP bar. */
function drawHpBar(g, x, y, w, frac) {
  g.clear();
  g.fillStyle(C.lightest); g.fillRect(x - 2, y - 2, w + 4, 10);
  g.fillStyle(C.darkest);  g.fillRect(x - 1, y - 1, w + 2, 8);
  g.fillStyle(frac > 0.25 ? C.lightest : C.light);
  g.fillRect(x, y, Math.max(0, Math.round(w * frac)), 6);
}

/* ---------- Tiny square-wave SFX via WebAudio (lazy, after first input) ---------- */
const SFX = {
  ctx: null,
  play(type) {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
      const presets = {
        blip:  [880, 880, 0.05], ok: [660, 990, 0.08], hit: [220, 60, 0.25],
        miss:  [300, 150, 0.2],  heal: [440, 880, 0.2], candle: [520, 560, 0.04], win: [523, 1046, 0.5],
      };
      const [f0, f1, dur] = presets[type] || presets.blip;
      o.type = 'square'; o.frequency.setValueAtTime(f0, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
      g.gain.setValueAtTime(0.05, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
    } catch (e) { /* audio is optional */ }
  },
};

const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
  KeyZ: 'ok', Enter: 'ok', Space: 'ok', KeyX: 'back', Escape: 'back', Backspace: 'back',
};
function bindKeys(scene, handler) {
  scene.input.keyboard.on('keydown', e => {
    const a = KEYMAP[e.code];
    if (a) { e.preventDefault && e.preventDefault(); handler(a); }
  });
}

// Attack pose: arm pushed out and tablet screen "lit up" (inverted)
const UNC_ATK_ROWS = UNC_ROWS.map((row, y) => {
  let r = row.split('');
  if (y >= 11 && y <= 16) { r.splice(11, 0, '.'); r = r.slice(0, 20); }   // tablet shoved forward 1px
  if (y === 13) { r[11] = '2'; r[12] = '2'; r[13] = '2'; }               // longer arm
  if (y >= 12 && y <= 15) for (let x = 15; x <= 18; x++) r[x] = r[x] === '0' ? '3' : r[x] === '3' ? '0' : r[x];
  return r.join('');
});

function makePixelTexture(scene, key, rows, scale) {
  const map = { '0': C.darkest, '1': C.dark, '2': C.light, '3': C.lightest };
  const g = scene.make.graphics({ x: 0, y: 0, add: false });
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (map[ch] !== undefined) { g.fillStyle(map[ch]); g.fillRect(x * scale, y * scale, scale, scale); }
  }));
  g.generateTexture(key, rows[0].length * scale, rows.length * scale);
  g.destroy();
}

/* =====================================================================
 * CANDLE CHART — the "enemy". Draws OHLCV candles with Phaser Graphics
 * and can play forward by animating the next historical candles in.
 * ===================================================================== */
class CandleChart {
  constructor(scene, x, y, w, h, pattern, opts = {}) {
    this.scene = scene; this.x = x; this.y = y; this.w = w; this.h = h;
    this.pattern = pattern;
    this.opts = Object.assign({ panel: true, volume: true, label: true, slot: 8 }, opts);
    this.slot = this.opts.slot;                          // px per candle (5px body + gap)
    this.visible = Math.floor((w - 12) / this.slot);     // candles that fit; older ones scroll off
    this.candles = pattern.candles.map(toCandle);        // revealed so far
    this.future = pattern.future.map(toCandle);          // hidden continuation
    this.cursor = 0;                                     // next future candle index
    this.nowIndex = this.candles.length;                 // divider: where the "prediction" starts
    this.live = null; this.pendingTarget = null;         // candle currently animating in
    this.showLine = !!this.opts.showLine;

    this.innerX = x + 6;
    const volH = this.opts.volume ? Math.floor(h * 0.15) : 0;
    this.priceTop = y + (this.opts.label ? 24 : 8);
    this.priceBottom = y + h - 8 - volH - (volH ? 6 : 0);
    this.volTop = this.priceBottom + 6; this.volBottom = y + h - 8;

    this.g = scene.add.graphics();
    this.label = this.opts.label ? txt(scene, x + 8, y + 6, '', 12, CSS.light) : null;
    this.redraw();
  }

  get objects() { return [this.g, this.label].filter(Boolean); }
  remaining() { return this.future.length - this.cursor; }
  lastClose() { return this.candles[this.candles.length - 1].c; }
  count() { return this.candles.length + (this.live ? 1 : 0); }
  windowStart() { return Math.max(0, this.count() - this.visible); }
  xOfIndex(i) { return this.innerX + (i - this.windowStart()) * this.slot; }

  /** Recent momentum: close now vs. 4 candles ago. */
  momentum() {
    const n = this.candles.length;
    return this.candles[n - 1].c >= this.candles[n - 5].c ? 'up' : 'down';
  }

  /** Price range of the visible window (incl. the full target of the animating candle so the scale doesn't jitter). */
  computeRange() {
    let lo = Infinity, hi = -Infinity;
    for (let i = this.windowStart(); i < this.candles.length; i++) { lo = Math.min(lo, this.candles[i].l); hi = Math.max(hi, this.candles[i].h); }
    if (this.pendingTarget) { lo = Math.min(lo, this.pendingTarget.l); hi = Math.max(hi, this.pendingTarget.h); }
    const pad = (hi - lo) * 0.06 || 1;
    this.lo = lo - pad; this.hi = hi + pad;
  }
  yOf(p) { return Math.round(this.priceBottom - (p - this.lo) / (this.hi - this.lo) * (this.priceBottom - this.priceTop)); }

  /* ---- CANDLE DRAWING ----
   * Bull candle (close >= open): solid lightest body.
   * Bear candle: hollow body (light outline, darkest fill).
   * Wick: 1px vertical line from high to low, drawn first so the body covers it.
   */
  drawCandle(g, c, i) {
    const sx = this.xOfIndex(i), cx = sx + 3;
    const bull = c.c >= c.o;
    const yH = this.yOf(c.h), yL = this.yOf(c.l), yO = this.yOf(c.o), yC = this.yOf(c.c);
    const top = Math.min(yO, yC), bh = Math.max(1, Math.abs(yO - yC));
    g.fillStyle(bull ? C.lightest : C.light);
    g.fillRect(cx, yH, 1, Math.max(1, yL - yH));          // wick
    if (bull) {
      g.fillStyle(C.lightest); g.fillRect(sx + 1, top, 5, bh);
    } else {
      g.fillStyle(C.light); g.fillRect(sx + 1, top, 5, bh);
      if (bh > 2) { g.fillStyle(C.darkest); g.fillRect(sx + 2, top + 1, 3, bh - 2); }
    }
  }

  redraw() {
    const g = this.g; g.clear();
    this.computeRange();
    const { x, y, w, h } = this;
    if (this.opts.panel) {
      g.fillStyle(C.dark); g.fillRect(x, y, w, h);
      g.fillStyle(C.darkest); g.fillRect(x + 2, y + 2, w - 4, h - 4);
    }
    // dotted grid
    g.fillStyle(C.dark);
    for (let k = 1; k < 4; k++) {
      const gy = Math.round(this.priceTop + (this.priceBottom - this.priceTop) * k / 4);
      for (let gx = this.innerX; gx < x + w - 6; gx += 4) g.fillRect(gx, gy, 1, 1);
    }
    const s = this.windowStart();
    // "NOW" divider where the pattern ended and the future began
    if (this.nowIndex >= s && this.nowIndex < this.count() + 1) {
      const nx = this.xOfIndex(this.nowIndex) - 1;
      for (let yy = this.priceTop; yy < this.volBottom; yy += 3) g.fillRect(nx, yy, 1, 2);
    }
    // volume bars
    if (this.opts.volume) {
      let maxV = 1;
      const all = this.candles.slice(s).concat(this.live ? [this.live] : []);
      all.forEach(c => { maxV = Math.max(maxV, c.v); });
      all.forEach((c, k) => {
        const vh = Math.max(1, Math.round((c.v / maxV) * (this.volBottom - this.volTop)));
        g.fillStyle(c.c >= c.o ? C.light : C.dark);
        g.fillRect(this.xOfIndex(s + k) + 1, this.volBottom - vh, 5, vh);
      });
    }
    // candles
    for (let i = s; i < this.candles.length; i++) this.drawCandle(g, this.candles[i], i);
    if (this.live) this.drawCandle(g, this.live, this.candles.length);
    // key level / trendline (TA TOOLS > TRENDLINE)
    if (this.showLine && this.pattern.line) this.drawLevel(g);
    if (this.label) {
      const last = this.live ? this.live.c : this.lastClose();
      this.label.setText(`${this.pattern.ticker} 1D  ${last.toFixed(2)}`);
    }
  }

  drawLevel(g) {
    const { a, b } = this.pattern.line;
    const slope = (b[1] - a[1]) / (b[0] - a[0]);
    const s = this.windowStart();
    const startIdx = Math.max(a[0], s);
    g.fillStyle(C.lightest);
    for (let px = this.xOfIndex(startIdx) + 3; px < this.x + this.w - 6; px++) {
      if (((px >> 2) & 1) === 1) continue;                 // dashed
      const idx = s + (px - this.innerX - 3) / this.slot;
      const py = this.yOf(a[1] + slope * (idx - a[0]));
      if (py >= this.priceTop && py <= this.priceBottom) g.fillRect(px, py, 1, 2);
    }
  }

  /* ---- ANIMATE FORWARD ----
   * Pops the next historical candle off `future` and "grows" it from its
   * open to its real high/low/close over `duration` ms, then commits it.
   */
  appendNext(duration = 320) {
    if (this.cursor >= this.future.length) return Promise.resolve(null);
    const target = this.future[this.cursor++];
    const o = target.o;
    this.pendingTarget = target;
    this.live = { o, h: o, l: o, c: o, v: 0 };
    return new Promise(resolve => {
      const t = { p: 0 };
      this.scene.tweens.add({
        targets: t, p: 1, duration, ease: 'Sine.easeOut',
        onUpdate: () => {
          const L = this.live;
          L.h = o + (target.h - o) * t.p; L.l = o + (target.l - o) * t.p;
          L.c = o + (target.c - o) * t.p; L.v = target.v * t.p;
          this.redraw();
        },
        onComplete: () => {
          this.live = null; this.pendingTarget = null;
          this.candles.push(target); this.redraw();
          resolve(target);
        },
      });
    });
  }

  /** Plays forward up to n candles sequentially; resolves with the revealed chunk. */
  async playForward(n, gap = 140) {
    const chunk = [];
    for (let k = 0; k < n; k++) {
      const c = await this.appendNext();
      if (!c) break;
      SFX.play('candle');
      chunk.push(c);
      await new Promise(r => this.scene.time.delayedCall(gap, r));
    }
    return chunk;
  }

  flash() {
    return new Promise(r => this.scene.tweens.add({ targets: this.objects, alpha: 0.15, duration: 70, yoyo: true, repeat: 3, onComplete: () => { this.objects.forEach(o => o.setAlpha(1)); r(); } }));
  }
  wobble() {
    return new Promise(r => this.scene.tweens.add({ targets: this.objects, x: '-=8', duration: 50, yoyo: true, repeat: 3, onComplete: () => { this.g.x = 0; if (this.label) this.label.x = this.x + 8; r(); } }));
  }
  destroy() { this.objects.forEach(o => o.destroy()); }
}

/* =====================================================================
 * DAMAGE RESOLUTION (pure function)
 * Compare the attack's predicted direction with what the revealed chunk
 * actually did (last close of chunk vs. close before the chunk).
 *   aligned  -> power + 2.5 per % moved (capped at 6%), x1.5 super effective,
 *               x1.3 if a TRENDLINE was drawn first
 *   wrong but choppy (<1.5% move) -> glancing 20% of power
 *   wrong and decisive            -> 0 damage, enemy gets a counter bonus
 * ===================================================================== */
function resolveAttack(move, beforeClose, momentumDir, chunk, patternId, trendBuff) {
  const end = chunk[chunk.length - 1].c;
  const pct = (end - beforeClose) / beforeClose * 100;
  const actual = pct >= 0 ? 'up' : 'down';
  const predicted = move.call === 'trend' ? momentumDir : move.call === 'reversal' ? flip(momentumDir) : move.call;
  const aligned = predicted === actual;
  const superEff = aligned && move.super.includes(patternId);
  let dmg = 0;
  if (aligned) dmg = (move.power + Math.min(Math.abs(pct), 6) * 2.5) * (superEff ? 1.5 : 1) * (trendBuff ? 1.3 : 1);
  else if (Math.abs(pct) < 1.5) dmg = move.power * 0.2;
  dmg = Math.round(dmg);
  return { pct, actual, predicted, aligned, superEff, dmg, glancing: !aligned && dmg > 0 };
}

class BattleScene extends Phaser.Scene {
  constructor() { super('Battle'); }
  init(data) {
    this.pattern = PATTERNS[data.index || 0];
    this.player = { hp: 100, maxHp: 100, focus: FOCUS_MAX, pp: MOVES.map(m => m.pp) };
    this.items = { COFFEE: 3, 'STOP LOSS': 2, 'ENERGY DRINK': 1 };

    this.trendBuff = false; this.stopLoss = false;
    this.stats = { turns: 0, hits: 0, misses: 0, dealt: 0, pnl: 0 };
    this.state = 'busy'; this.skipFn = null;
  }

  create() {
    const P = this.pattern;
    /* --- enemy window (top right) + chart --- */
    const eg = this.add.graphics(); drawBox(eg, 196, 4, 278, 50);
    txt(this, 210, 13, P.name, 14);
    txt(this, 400, 13, `Lv.${P.lv}`, 12, CSS.light);
    txt(this, 210, 32, 'HP', 11, CSS.light);
    this.enemyHpG = this.add.graphics();
    this.enemyHpShown = this.enemy.hp; this.redrawEnemyHp();
    this.chart = new CandleChart(this, 198, 58, 274, 236, P);

    /* --- player window (top left) + sprite --- */
    const pg = this.add.graphics(); drawBox(pg, 6, 4, 186, 68);
    txt(this, 20, 13, 'UNC DUDE', 14);
    txt(this, 130, 13, 'Lv.42', 12, CSS.light);
    txt(this, 20, 32, 'HP', 11, CSS.light);
    this.playerHpG = this.add.graphics();
    this.playerHpText = txt(this, 20, 48, '', 11, CSS.lightest);
    this.playerHpShown = this.player.hp; this.redrawPlayerHp();

    const plat = this.add.graphics(); plat.fillStyle(C.dark); plat.fillEllipse(92, 290, 140, 16);
    this.sprite = this.add.image(92, 288, 'unc').setOrigin(0.5, 1);
    this.tweens.add({ targets: this.sprite, y: 286, duration: 500, yoyo: true, repeat: -1 }); // idle bob

    /* --- bottom UI --- */
    const bg = this.add.graphics(); drawBox(bg, 6, 300, 468, 128);
    this.msg = txt(this, 22, 316, '', 17).setWordWrapWidth(436).setLineSpacing(6);
    this.menuG = this.add.graphics();
    this.menuTexts = [];
    this.infoText = null;

    bindKeys(this, a => this.onAction(a));
    this.input.on('pointerdown', (p, over) => { if (this.state === 'busy' && over.length === 0 && this.skipFn) this.skipFn(); });

    this.intro();
  }

  /* ---------- HUD ---------- */
  redrawEnemyHp() { drawHpBar(this.enemyHpG, 240, 35, 220, this.enemyHpShown / this.enemy.maxHp); }
  redrawPlayerHp() {
    drawHpBar(this.playerHpG, 48, 35, 132, this.playerHpShown / this.player.maxHp);
    this.playerHpText.setText(`${Math.ceil(this.playerHpShown)}/${this.player.maxHp}  FOCUS ${this.player.focus}`);
  }
  tweenHp(who) {
    const key = who === 'enemy' ? 'enemyHpShown' : 'playerHpShown';
    const target = who === 'enemy' ? this.enemy.hp : this.player.hp;
    return new Promise(r => this.tweens.add({
      targets: this, [key]: target, duration: 500,
      onUpdate: () => (who === 'enemy' ? this.redrawEnemyHp() : this.redrawPlayerHp()),
      onComplete: () => { (who === 'enemy' ? this.redrawEnemyHp() : this.redrawPlayerHp()); r(); },
    }));
  }

  /* ---------- Narration (typewriter, Z/click to skip) ---------- */
  say(text, hold = 650) {
    this.clearMenu();
    this.msg.setWordWrapWidth(436);
    return new Promise(resolve => {
      let i = 0, finished = false, ended = false, typeEv = null;
      const end = () => { if (ended) return; ended = true; this.skipFn = null; resolve(); };
      const finishTyping = () => {
        if (finished) return; finished = true;
        if (typeEv) typeEv.remove(false);
        this.msg.setText(text);
        const holdEv = this.time.delayedCall(hold, end);
        this.skipFn = () => { holdEv.remove(false); end(); };
      };
      this.msg.setText('');
      this.skipFn = finishTyping;
      typeEv = this.time.addEvent({ delay: 16, loop: true, callback: () => {
        i += 1; this.msg.setText(text.slice(0, i)); if (i >= text.length) finishTyping();
      } });
    });
  }
  wait(ms) { return new Promise(r => this.time.delayedCall(ms, r)); }

  /* ---------- Menus ---------- */
  clearMenu() {
    this.menuG.clear();
    this.menuTexts.forEach(t => t.destroy()); this.menuTexts = [];
    if (this.infoText) { this.infoText.destroy(); this.infoText = null; }
    if (this.cursorText) { this.cursorText.destroy(); this.cursorText = null; }
  }

  openMain() {
    this.state = 'main'; this.clearMenu();
    this.msg.setWordWrapWidth(220).setText('What will\nUNC DUDE do?');
    drawBox(this.menuG, 262, 300, 212, 128);
    const labels = ['FIGHT', 'TA TOOLS', 'ITEMS', 'RUN'];
    this.options = labels.map((l, i) => ({ label: l }));
    this.layoutOptions([[296, 334], [380, 334], [296, 380], [380, 380]], 16);
    this.setCursor(this.mainIdx || 0);
  }

  /** Generic 2x2 list (fight / tools / items). Each option: {label, info(), enabled(), act()} */
  openList(kind, options) {
    this.state = 'list'; this.listKind = kind; this.clearMenu();
    this.msg.setText('');
    drawBox(this.menuG, 326, 300, 148, 128);
    this.options = options;
    // 2x2 grid: two columns x two rows (each option has a sub-line underneath)
    this.layoutOptions([[34, 326], [182, 326], [34, 372], [182, 372]], 13);
    this.infoText = txt(this, 340, 314, '', 12).setWordWrapWidth(124).setLineSpacing(4);
    this.setCursor(0);
  }

  layoutOptions(positions, size) {
    this.optPos = positions;
    this.options.forEach((o, i) => {
      const [x, y] = positions[i];
      const disabled = o.enabled && !o.enabled();
      const t = txt(this, x, y, o.label, size, disabled ? CSS.dark : CSS.lightest);
      if (o.sub) this.menuTexts.push(txt(this, x, y + 18, o.sub(), 11, CSS.light));
      t.setInteractive({ useHandCursor: true });
      t.on('pointerover', () => { if (this.state !== 'busy') this.setCursor(i); });
      t.on('pointerdown', () => { if (this.state !== 'busy') { this.setCursor(i); this.confirm(); } });
      this.menuTexts.push(t);
    });
    this.cursorText = txt(this, 0, 0, '▶', size);
  }

  setCursor(i) {
    if (this.cursorIdx !== i && this.cursorText && this.cursorText.visible) SFX.play('blip');
    this.cursorIdx = i;
    const [x, y] = this.optPos[i];
    this.cursorText.setPosition(x - 18, y);
    if (this.state === 'main') this.mainIdx = i;
    if (this.infoText && this.options[i].info) this.infoText.setText(this.options[i].info());
  }

  onAction(a) {
    if (this.state === 'busy') { if (a === 'ok' && this.skipFn) this.skipFn(); return; }
    if (this.state === 'done') return;
    const n = this.options.length, i = this.cursorIdx;
    if (n === 4) {   // 2x2 grid navigation
      const col = i % 2, row = Math.floor(i / 2);
      if (a === 'left' || a === 'right') this.setCursor(row * 2 + (1 - col));
      if (a === 'up' || a === 'down') this.setCursor((1 - row) * 2 + col);
    } else if (n > 1 && (a === 'up' || a === 'down' || a === 'left' || a === 'right')) {
      this.setCursor((i + 1) % n);
    }
    if (a === 'ok') this.confirm();
    if (a === 'back' && this.state === 'list') { SFX.play('blip'); this.openMain(); }
  }

  confirm() {
    const i = this.cursorIdx;
    if (this.state === 'main') {
      SFX.play('ok');
      [() => this.openFight(), () => this.openTools(), () => this.openItems(), () => this.run()][i]();
      return;
    }
    const o = this.options[i];
    if (o.enabled && !o.enabled()) { SFX.play('miss'); return; }
    SFX.play('ok');
    o.act();
  }

  openFight() {
    this.openList('fight', MOVES.map((m, k) => ({
      label: m.name,
      sub: () => `PP ${this.player.pp[k]}/${m.pp}`,
      enabled: () => this.player.pp[k] > 0,
      info: () => `PP ${this.player.pp[k]}/${m.pp}\nCALL: ${m.call.toUpperCase()}\n${m.blurb}`,
      act: () => this.playerAttack(k),
    })));
  }

  openTools() {
    const P = this.pattern, line = P.line;
    this.openList('tools', [
      { label: 'TRENDLINE', sub: () => 'FOCUS 3', enabled: () => this.player.focus >= 3 && !this.trendBuff,
        info: () => `Draw the ${line.label}. Next aligned hit x1.3.`,
        act: () => this.useTool(3, async () => {
          this.chart.showLine = true; this.chart.redraw(); this.trendBuff = true;
          await this.say(`UNC DUDE drew the ${line.label} near ${line.b[1].toFixed(2)}!`);
          await this.say('Next aligned hit gets a x1.3 bonus.');
        }) },
      { label: 'FIB SCAN', sub: () => 'FOCUS 4', enabled: () => this.player.focus >= 4,
        info: () => 'Peek at the odds for the next candles.',
        act: () => this.useTool(4, async () => {
          const next = this.chart.future.slice(this.chart.cursor, this.chart.cursor + CHUNK);
          if (!next.length) return this.say('Nothing left to scan...');
          const dir = next[next.length - 1].c >= this.chart.lastClose() ? 'UP' : 'DOWN';
          await this.say(`Fib levels line up... the next move leans ${dir}.`);
        }) },
      { label: 'RSI CHECK', sub: () => 'FOCUS 1', enabled: () => this.player.focus >= 1,
        info: () => 'Read RSI(14) and recent momentum.',
        act: () => this.useTool(1, async () => {
          const r = rsi(this.chart.candles, 14);
          const zone = r > 70 ? 'OVERBOUGHT' : r < 30 ? 'OVERSOLD' : 'NEUTRAL';
          await this.say(`RSI(14) = ${r.toFixed(1)} (${zone}). Momentum is ${this.chart.momentum().toUpperCase()}.`);
        }) },
    ]);
  }

  openItems() {
    const it = this.items;
    this.openList('items', [
      { label: 'COFFEE', sub: () => `x${it.COFFEE}`, enabled: () => it.COFFEE > 0, info: () => 'Restores 30 HP.',
        act: () => this.useItem(async () => {
          it.COFFEE--; this.player.hp = Math.min(this.player.maxHp, this.player.hp + 30);
          SFX.play('heal'); await this.say('UNC DUDE sipped a COFFEE! Restored 30 HP.'); await this.tweenHp('player');
        }) },
      { label: 'STOP LOSS', sub: () => `x${it['STOP LOSS']}`, enabled: () => it['STOP LOSS'] > 0 && !this.stopLoss, info: () => 'Halves the next enemy hit.',
        act: () => this.useItem(async () => {
          it['STOP LOSS']--; this.stopLoss = true; await this.say('UNC DUDE set a STOP LOSS! Next hit is halved.');
        }) },
      { label: 'ENERGY DRINK', sub: () => `x${it['ENERGY DRINK']}`, enabled: () => it['ENERGY DRINK'] > 0, info: () => 'Restores 5 FOCUS and 2 PP each.',
        act: () => this.useItem(async () => {
          it['ENERGY DRINK']--; this.player.focus = Math.min(FOCUS_MAX, this.player.focus + 5);
          this.player.pp = this.player.pp.map((v, k) => Math.min(MOVES[k].pp, v + 2));
          SFX.play('heal'); this.redrawPlayerHp(); await this.say('UNC DUDE chugged an ENERGY DRINK! FOCUS and PP restored.');
        }) },
    ]);
  }

  /** TA tools are a free action (they only cost FOCUS). */
  async useTool(cost, fn) {
    this.state = 'busy'; this.player.focus -= cost; this.redrawPlayerHp();
    await fn();
    this.openMain();
  }
  /** Items use up the turn: the enemy acts afterwards (chart does not advance). */
  async useItem(fn) {
    this.state = 'busy';
    await fn();
    await this.enemyTurn(false);
    if (this.player.hp > 0) this.openMain();
  }

  async run() {
    this.state = 'busy';
    await this.say('UNC DUDE closed the position and walked away.');
    this.scene.start('Select');
  }

  async intro() {
    const P = this.pattern;
    this.sprite.x = -60;
    this.tweens.add({ targets: this.sprite, x: 92, duration: 600, ease: 'Quad.easeOut' });
    await this.say(`A wild ${P.name} appeared on ${P.ticker}!`);
    await this.say(`${P.bias === 'up' ? 'BULLISH' : 'BEARISH'} setup. Predict what the next candles do!`);
    this.openMain();
  }

  /* =================================================================
   * TURN SEQUENCE
   * 1) narration  2) attack animation  3) chart plays forward CHUNK
   * candles  4) resolve alignment -> damage/fx  5) victory check
   * 6) enemy turn  7) defeat check  8) back to menu
   * ================================================================= */
  async playerAttack(k) {
    const move = MOVES[k];
    this.state = 'busy';
    this.player.pp[k]--;
    this.stats.turns++;

    if (this.chart.remaining() <= 0) return this.chartExhausted();

    await this.say(`UNC DUDE used ${move.name}!`, 300);
    await this.attackAnimation();

    // Snapshot state BEFORE the reveal so the call is judged fairly
    const beforeClose = this.chart.lastClose();
    const momentumDir = this.chart.momentum();

    this.msg.setText('The chart plays forward...');
    const chunk = await this.chart.playForward(CHUNK);

    const res = resolveAttack(move, beforeClose, momentumDir, chunk, this.pattern.id, this.trendBuff);
    const moveTxt = `Called ${res.predicted.toUpperCase()}. Price went ${res.actual.toUpperCase()} ${Math.abs(res.pct).toFixed(1)}%.`;

    if (res.aligned) {
      this.trendBuff = false;
      this.stats.hits++; this.stats.pnl += Math.abs(res.pct);
      await this.say(moveTxt, 400);
      await this.hitEffects(res.dmg);
      if (res.superEff) await this.say("It's super effective!", 450);
      await this.say(`${this.pattern.name} took ${res.dmg} damage!`, 400);
    } else {
      this.stats.misses++; this.stats.pnl -= Math.abs(res.pct);
      SFX.play('miss');
      await this.say(moveTxt, 400);
      if (res.glancing) { await this.hitEffects(res.dmg, true); await this.say(`Choppy tape... only ${res.dmg} damage.`); }
      else await this.say('The market disagreed! No damage.');
    }

    if (this.enemy.hp <= 0) return this.victory();
    if (this.chart.remaining() <= 0) return this.chartExhausted();

    await this.enemyTurn(!res.aligned && !res.glancing);
    if (this.player.hp > 0) this.openMain();
  }

  /** Player lunge + tablet glow, then pixel projectiles fly into the chart. */
  async attackAnimation() {
    const s = this.sprite;
    s.setTexture('unc_atk');
    this.tweens.add({ targets: s, x: s.x + 16, duration: 110, yoyo: true });
    SFX.play('ok');
    const sx = s.x + 40, sy = s.y - 62, tx = 335, ty = 170;
    const shots = [];
    for (let i = 0; i < 6; i++) {
      const p = this.add.image(sx, sy, 'px').setDepth(10);
      shots.push(new Promise(r => this.tweens.add({
        targets: p, x: tx + Phaser.Math.Between(-20, 20), y: ty + Phaser.Math.Between(-30, 30),
        delay: i * 60, duration: 260, ease: 'Quad.easeIn',
        onComplete: () => { this.burst(p.x, p.y, 5); p.destroy(); r(); },
      })));
    }
    await Promise.all(shots);
    s.setTexture('unc');
  }

  burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const q = this.add.image(x, y, 'px2').setDepth(10);
      const a = Math.random() * Math.PI * 2, d = 14 + Math.random() * 16;
      this.tweens.add({ targets: q, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, alpha: 0, duration: 280, onComplete: () => q.destroy() });
    }
  }

  /** Damage FX: HP bar drops, damage number pops, chart flashes, screen shakes. */
  async hitEffects(dmg, small = false) {
    SFX.play('hit');
    this.enemy.hp = Math.max(0, this.enemy.hp - dmg);
    this.stats.dealt += dmg;
    this.cameras.main.shake(small ? 120 : 260, small ? 0.004 : 0.012);
    const num = txt(this, 335, 150, `-${dmg}`, small ? 20 : 30).setOrigin(0.5).setDepth(20).setStroke(CSS.darkest, 6);
    this.tweens.add({ targets: num, y: 110, alpha: 0, duration: 900, ease: 'Quad.easeOut', onComplete: () => num.destroy() });
    await Promise.all([this.chart.flash(), this.tweenHp('enemy')]);
  }

  /** Basic enemy turn: the pattern lashes back (harder if you misread it). */
  async enemyTurn(counter) {
    const P = this.pattern;
    const move = pick(P.enemyMoves);
    let dmg = Phaser.Math.Between(6, 12) + (counter ? 8 : 0);
    await this.say(`${P.name} used ${move}!`, 300);
    await this.chart.wobble();
    if (this.stopLoss) { dmg = Math.ceil(dmg / 2); this.stopLoss = false; }
    this.player.hp = Math.max(0, this.player.hp - dmg);
    SFX.play('hit');
    this.cameras.main.shake(150, 0.006);
    this.tweens.add({ targets: this.sprite, alpha: 0.1, duration: 60, yoyo: true, repeat: 3, onComplete: () => this.sprite.setAlpha(1) });
    await this.tweenHp('player');
    await this.say(counter ? `Bad read punished! UNC DUDE lost ${dmg} HP.` : `UNC DUDE lost ${dmg} HP.`, 450);
    if (this.player.hp <= 0) {
      this.state = 'done';
      await this.say('UNC DUDE got LIQUIDATED!', 900);
      this.scene.start('End', { win: false, pattern: P.name, stats: this.stats });
    }
  }

  async victory() {
    this.state = 'done';
    const P = this.pattern;
    SFX.play('win');
    await this.chart.flash();
    this.tweens.add({ targets: this.chart.objects, alpha: 0.25, duration: 600 });
    await this.say(`${P.name} was CONFIRMED and CLEARED!`, 900);
    const cleared = this.registry.get('cleared'); cleared[P.id] = true;
    this.scene.start('End', { win: true, pattern: P.name, stats: this.stats });
  }

  async chartExhausted() {
    this.state = 'done';
    await this.say('No more candles! The chart fully played out.', 600);
    const win = this.enemy.hp <= this.player.hp * 0.5;
    await this.say(win ? 'The pattern is mostly priced in. You take the W!' : 'The pattern escaped before you could finish it...', 900);
    if (win) this.registry.get('cleared')[this.pattern.id] = true;
    this.scene.start('End', { win, pattern: this.pattern.name, stats: this.stats });
  }
}

/** Wilder-style RSI over closes (used by RSI CHECK). */
function rsi(candles, period) {
  const closes = candles.map(c => c.c);
  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) { const d = closes[i] - closes[i - 1]; if (d > 0) gain += d; else loss -= d; }
  gain /= period; loss /= period;
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    gain = (gain * (period - 1) + Math.max(d, 0)) / period;
    loss = (loss * (period - 1) + Math.max(-d, 0)) / period;
  }
  return loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
}

/* ---------- Victory / Game over ---------- */
class EndScene extends Phaser.Scene {
  constructor() { super('End'); }
  init(d) { this.d = d; }
  create() {
    const { win, pattern, stats } = this.d;
    const g = this.add.graphics(); drawBox(g, 30, 40, 420, 352);
    txt(this, W / 2, 84, win ? 'VICTORY!' : 'GAME OVER', 40).setOrigin(0.5);
    txt(this, W / 2, 128, win ? `${pattern} defeated` : `${pattern} won this round`, 14, CSS.light).setOrigin(0.5);
    this.add.image(W / 2, 262, win ? 'unc_atk' : 'unc').setOrigin(0.5, 1).setAngle(win ? 0 : 90);
    const acc = stats.hits + stats.misses ? Math.round(100 * stats.hits / (stats.hits + stats.misses)) : 0;
    const pnl = (stats.pnl >= 0 ? '+' : '') + stats.pnl.toFixed(1) + '%';
    txt(this, 70, 270, `CALLS   ${stats.hits} RIGHT / ${stats.misses} WRONG (${acc}%)`, 13);
    txt(this, 70, 294, `DAMAGE  ${stats.dealt}`, 13);
    txt(this, 70, 318, `P&L     ${pnl}   EXP +${win ? 120 + stats.dealt : 10}`, 13);
    const p = txt(this, W / 2, 360, 'PRESS START', 18).setOrigin(0.5);
    this.tweens.add({ targets: p, alpha: 0, duration: 450, yoyo: true, repeat: -1 });
    if (win) SFX.play('win');
    let going = false;
    const go = () => { if (going) return; going = true; this.scene.start('Select'); };
    this.time.delayedCall(400, () => {
      bindKeys(this, a => { if (a === 'ok') go(); });
      this.input.on('pointerdown', go);
    });
  }
}

/* ---------- Boot Phaser ---------- */
const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W, height: H,
  backgroundColor: CSS.darkest,
  pixelArt: true,             // nearest-neighbour scaling, no smoothing
  roundPixels: true,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, TitleScene, SelectScene, BattleScene, EndScene],
});
window.__chartQuest = { game, PATTERNS, MOVES, resolveAttack };

</script>
